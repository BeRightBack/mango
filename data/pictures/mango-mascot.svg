<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mango Music Player mascot.

  Drawn for this project. The proportions deliberately match the 590x800
  footprint of the upstream mascot it replaces, so it sits in the bottom right
  corner of the playlist at the same scale and position.

  Palette is shared with the application icon (data/icons/*/mango.png) so the
  mascot and the window artwork read as one set.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 800" width="590" height="800">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FFB74D"/>
      <stop offset="0.55" stop-color="#FFA726"/>
      <stop offset="1" stop-color="#EF8A17"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66BB6A"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7043" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- stem -->
  <path d="M300 176 C296 140 282 118 258 104"
        fill="none" stroke="#6D4C41" stroke-width="16" stroke-linecap="round"/>

  <!-- leaf -->
  <path d="M268 108 C300 44 384 26 442 44 C438 106 366 152 288 138 Z"
        fill="url(#leaf)"/>
  <path d="M282 124 C330 88 384 66 430 56"
        fill="none" stroke="#1B5E20" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- arms, drawn behind the body so the joins stay hidden -->
  <path d="M124 424 C74 442 44 486 40 534"
        fill="none" stroke="#E07B12" stroke-width="30" stroke-linecap="round"/>
  <path d="M470 412 C520 428 552 470 556 518"
        fill="none" stroke="#E07B12" stroke-width="30" stroke-linecap="round"/>

  <!-- legs -->
  <path d="M206 630 C196 686 190 724 190 752"
        fill="none" stroke="#E07B12" stroke-width="32" stroke-linecap="round"/>
  <path d="M362 634 C372 690 378 728 378 756"
        fill="none" stroke="#E07B12" stroke-width="32" stroke-linecap="round"/>

  <!-- body -->
  <path d="M302 168
           C424 172 496 278 492 412
           C488 552 386 656 262 648
           C150 640 96 548 104 434
           C112 312 186 206 274 176
           C284 173 294 170 302 168 Z"
        fill="url(#body)"/>

  <!-- shading on the right flank -->
  <path d="M348 206 C424 244 470 316 474 400 C478 512 414 604 320 640
           C388 626 436 552 434 452 C432 342 396 258 348 206 Z"
        fill="#D97706" opacity="0.5"/>

  <!-- highlight -->
  <ellipse cx="212" cy="330" rx="52" ry="74" fill="#FFCC80" opacity="0.75"
           transform="rotate(-18 212 330)"/>

  <!-- cheeks -->
  <ellipse cx="180" cy="452" rx="42" ry="30" fill="url(#cheek)"/>
  <ellipse cx="404" cy="440" rx="42" ry="30" fill="url(#cheek)"/>

  <!-- eyes -->
  <ellipse cx="238" cy="378" rx="28" ry="32" fill="#3E2723"/>
  <ellipse cx="356" cy="374" rx="28" ry="32" fill="#3E2723"/>
  <circle cx="248" cy="366" r="10" fill="#FFFFFF"/>
  <circle cx="366" cy="362" r="10" fill="#FFFFFF"/>
  <circle cx="230" cy="390" r="5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="348" cy="386" r="5" fill="#FFFFFF" opacity="0.7"/>

  <!-- brows -->
  <path d="M212 330 C232 318 254 318 268 328"
        fill="none" stroke="#5D4037" stroke-width="11" stroke-linecap="round"/>
  <path d="M330 322 C346 312 368 314 382 326"
        fill="none" stroke="#5D4037" stroke-width="11" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M244 462 C268 512 314 528 352 494"
        fill="none" stroke="#3E2723" stroke-width="15" stroke-linecap="round"/>

  <!-- feet -->
  <ellipse cx="168" cy="762" rx="46" ry="24" fill="#D97706"/>
  <ellipse cx="400" cy="766" rx="46" ry="24" fill="#D97706"/>
</svg>
